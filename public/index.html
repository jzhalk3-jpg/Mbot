<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Telegram Web</title>

<link
rel="stylesheet"
href="/style.css"
>

</head>

<body>

<!-- LOGIN -->

<section
id="loginPage"
class="login-page"
>

<div class="login-card">

<div class="telegram-logo">
✈
</div>

<h1>Telegram</h1>

<p>
أدخل رقم هاتفك للوصول إلى حسابك
</p>

<div
id="phoneStep"
>

<input
id="phoneInput"
placeholder="+967XXXXXXXXX"
type="tel"
>

<button
id="sendCodeBtn"
>
متابعة
</button>

</div>

<div
id="codeStep"
class="hidden"
>

<input
id="codeInput"
placeholder="رمز التحقق"
type="text"
inputmode="numeric"
>

<button
id="verifyCodeBtn"
>
تسجيل الدخول
</button>

</div>

<div
id="passwordStep"
class="hidden"
>

<input
id="passwordInput"
placeholder="كلمة مرور التحقق بخطوتين"
type="password"
>

<button
id="verifyPasswordBtn"
>
متابعة
</button>

</div>

<p
id="status"
></p>

</div>

</section>


<!-- MAIN APP -->

<section
id="appPage"
class="app hidden"
>

<!-- SIDEBAR -->

<aside
class="sidebar"
>

<header
class="sidebar-header"
>

<button
id="settingsBtn"
class="icon-button"
>
☰
</button>

<input
id="searchInput"
placeholder="بحث"
>

</header>

<div
id="dialogs"
class="dialogs"
></div>

</aside>


<!-- CHAT -->

<main
class="chat"
>

<div
id="emptyChat"
class="empty-chat"
>

<div class="big-logo">
✈
</div>

<h2>
Telegram Web
</h2>

<p>
اختر محادثة
</p>

</div>

<div
id="chatPage"
class="chat-page hidden"
>

<header
id="chatHeader"
class="chat-header"
></header>

<div
id="messages"
class="messages"
></div>

<footer
class="message-box"
>

<label
for="fileInput"
class="file-btn"
>
📎
</label>

<input
id="fileInput"
type="file"
hidden
>

<textarea
id="messageInput"
placeholder="اكتب رسالة"
></textarea>

<button
id="sendBtn"
>
➤
</button>

</footer>

</div>

</main>

</section>


<!-- SETTINGS -->

<div
id="settingsModal"
class="modal hidden"
>

<div
class="modal-box"
>

<button
id="closeSettings"
class="close"
>
×
</button>

<h2>
الإعدادات
</h2>

<div
id="profileInfo"
></div>

<hr>

<button
id="darkModeBtn"
>
🌙 الوضع الداكن
</button>

<button
id="logoutBtn"
class="danger"
>
تسجيل الخروج
</button>

</div>

</div>

<script src="/app.js"></script>

</body>

</html>
